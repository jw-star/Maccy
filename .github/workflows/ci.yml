name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: swiftlint lint --reporter github-actions-logging

  build-and-test:
    name: Build & Test
    runs-on: macos-26
    env:
      CI: "true"
      XCODEBUILD_FLAGS: >-
        -project Maccy.xcodeproj
        -scheme Maccy
        -destination platform=macOS
        -derivedDataPath DerivedData
        CODE_SIGN_IDENTITY=-
        CODE_SIGNING_REQUIRED=NO
        DEVELOPMENT_TEAM=
        CODE_SIGN_ENTITLEMENTS=
        ENABLE_HARDENED_RUNTIME=NO
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Maccy.xcodeproj -scheme Maccy

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build $XCODEBUILD_FLAGS | tee build.log | xcbeautify --renderer github-actions

      - name: Test
        timeout-minutes: 20
        run: |
          set -o pipefail
          xcodebuild test $XCODEBUILD_FLAGS \
            -only-testing:MaccyTests \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 120 \
            -resultBundlePath TestResults.xcresult \
            | tee test.log | xcbeautify --renderer github-actions

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults.xcresult
            build.log
            test.log
          if-no-files-found: ignore
